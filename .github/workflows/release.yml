# Publishes a new version of the app.
#
# Push a tag like v0.2.0 (it must match "version" in package.json) and this builds the
# Windows installer and attaches it to a GitHub release. Installed copies of the app
# find that release on their own and update themselves (electron-updater).
#
#   npm version minor      # bumps package.json and creates the tag v0.2.0
#   git push --follow-tags
#
# Code signing (optional): when the repository variable SIGNPATH_ORGANIZATION_ID is set,
# the installer is signed by SignPath before it is published. See docs/RELEASING.md.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # The MongoDB server binary is large; keep it between runs.
      - uses: actions/cache@v4
        with:
          path: resources/mongod
          key: mongod-${{ runner.os }}-${{ hashFiles('scripts/fetch-mongod.mjs') }}

      - run: npm run fetch:mongod

      - run: npm run build

      - name: Build the installer
        run: npx electron-builder --win --publish never

      # ---- signing (only when SignPath is configured) ----
      - name: Upload the unsigned installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: dist/*-Setup-*.exe

      - name: Sign the installer with SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: opengantt-bim
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use the signed installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        run: |
          rm -f dist/*-Setup-*.exe dist/*.blockmap
          cp signed/*-Setup-*.exe dist/
          node scripts/write-latest-yml.mjs dist

      # ---- publish ----
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=(dist/*-Setup-*.exe dist/latest.yml)
          # The blockmap lets installed apps download only what changed. A signed
          # installer no longer matches the one it was made for, so it is left out.
          if [ -z "${{ vars.SIGNPATH_ORGANIZATION_ID }}" ]; then files+=(dist/*.blockmap); fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "$GITHUB_REF_NAME" --generate-notes
