# Publishes a new version of the app.
#
# Push a tag like v0.2.0 (it must match "version" in package.json) and this builds the
# Windows installer and attaches it to a GitHub release. Installed copies of the app
# find that release on their own and update themselves (electron-updater).
#
#   npm version minor      # bumps package.json and creates the tag v0.2.0
#   git push --follow-tags
#
# Code signing (optional): when the repository variable SIGNPATH_ORGANIZATION_ID is set,
# the installer is signed by SignPath before it is published. See docs/RELEASING.md.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Electron installs its binary lazily (no postinstall), but the installer packages
      # node_modules/electron/dist (electronDist in electron-builder.yml). Install it here,
      # checked against the checksums in the electron package, and keep the download
      # between runs so a GitHub hiccup can't block a release.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/electron-cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the Electron binary
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache
        run: node node_modules/electron/install.js

      - run: npm run typecheck

      - run: npm test

      # The MongoDB server binary is large; keep it between runs.
      - uses: actions/cache@v4
        with:
          path: resources/mongod
          key: mongod-${{ runner.os }}-${{ hashFiles('scripts/fetch-mongod.mjs') }}

      - run: npm run fetch:mongod

      # Java runtime + MPXJ for reading .mpp files; built from a JDK with jlink.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/cache@v4
        with:
          path: resources/mpp
          key: mpp-${{ runner.os }}-${{ hashFiles('scripts/fetch-mpp-runtime.mjs', 'scripts/mpp/MppToXml.java') }}

      - run: npm run fetch:mpp

      - run: npm run build

      # electron-builder downloads its packaging tools (NSIS, icons, 7-Zip) from GitHub, which now
      # and then answers 504. Keep them between runs and retry once before giving up.
      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron-builder\Cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Build the installer
        shell: bash
        run: |
          npx electron-builder --win --publish never && exit 0
          echo "electron-builder failed; retrying once in 60 s"
          sleep 60
          npx electron-builder --win --publish never

      # ---- signing (only when SignPath is configured) ----
      - name: Upload the unsigned installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: dist/*-Setup-*.exe

      - name: Sign the installer with SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: opengantt-bim
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use the signed installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        run: |
          rm -f dist/*-Setup-*.exe dist/*.blockmap
          cp signed/*-Setup-*.exe dist/
          node scripts/write-latest-yml.mjs dist

      # ---- publish ----
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=(dist/*-Setup-*.exe dist/latest.yml)
          # The blockmap lets installed apps download only what changed. A signed
          # installer no longer matches the one it was made for, so it is left out.
          if [ -z "${{ vars.SIGNPATH_ORGANIZATION_ID }}" ]; then files+=(dist/*.blockmap); fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "$GITHUB_REF_NAME" --generate-notes
