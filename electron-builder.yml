appId: dev.opengantt.bim
productName: Opengantt BIM
directories:
  output: dist
files:
  - out/**
  - package.json
# Package the Electron that `npm ci` already installed (verified against the checksums
# shipped in the electron npm package) instead of downloading it again from GitHub
# releases, whose SHASUMS256.txt download failing with 504 broke the v0.2.0 release.
electronDist: node_modules/electron/dist
# The bundled MongoDB server ships next to the app, outside the asar archive,
# so it can be executed. Run `npm run fetch:mongod` before packaging.
extraResources:
  - from: resources/mongod
    to: mongod
  # Java runtime + MPXJ, used to read .mpp files. Run `npm run fetch:mpp` first.
  - from: resources/mpp
    to: mpp
    filter:
      - '**/*'
      - '!.complete'
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
# Releases are published to GitHub; installed apps look there for newer versions
# (electron-updater). See .github/workflows/release.yml.
publish:
  provider: github
  owner: gjordanp
  repo: opengantt-bim
win:
  target: nsis
  icon: build/icon.png
  artifactName: Opengantt-BIM-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
linux:
  target: AppImage
